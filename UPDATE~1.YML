name: 更新股票期貨保證金與股票現價資料

on:
  schedule:
    # 台灣時間下午 3:10(UTC 07:10),週一到週五 —— 收盤後第一次抓
    - cron: '10 7 * * 1-5'
    # 台灣時間晚上 7:10(UTC 11:10),週一到週五 —— 保險補抓一次,確保資料齊全
    - cron: '10 11 * * 1-5'
  workflow_dispatch: {}   # 讓你可以在 Actions 頁面手動按「Run workflow」馬上測試

permissions:
  contents: write   # 要能把新的資料檔推回 repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取並計算股票期貨保證金
        run: python fetch_margin_data.py

      - name: 抓取 TWSE/TPEx 股票現價
        run: python fetch_stock_prices.py

      - name: 把新的資料檔推回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add margin_latest.json "margin_*.json" stock_prices_latest.json "stock_prices_*.json"
          git diff --cached --quiet && echo "資料沒有變動,略過 commit" || git commit -m "自動更新保證金與股票現價資料 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
